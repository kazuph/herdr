name: Kazuph distribution release

on:
  push:
    tags:
      - "kazuph-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - id: release
        name: Fail closed outside the fork release boundary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#kazuph-v}"
          VALIDATED_VERSION="$(python3 scripts/fork_release_input.py --repository "$GITHUB_REPOSITORY" --ref-name "$GITHUB_REF_NAME")"
          test "$VERSION" = "$VALIDATED_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  credentials:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kazuph/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap-credential-check
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Prove distribution credentials before building
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NPM_TOKEN"
          test "$(npm whoami --registry https://registry.npmjs.org)" = "kazuph"
          git -C tap-credential-check config user.name "github-actions[bot]"
          git -C tap-credential-check config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap-credential-check commit --allow-empty -m "verify herdr release credential"
          git -C tap-credential-check push --dry-run origin HEAD:main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build:
    needs: [preflight, credentials]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: herdr-macos-aarch64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15 cmake ninja
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
      - name: Build the tagged native asset
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the release asset
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.asset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  package-npm:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: herdr-*
          path: distribution/assets
          merge-multiple: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Pack and verify the scoped npm package archives
        run: python3 scripts/fork_npm_packages.py --version "${{ needs.preflight.outputs.version }}" pack --artifacts distribution/assets --output distribution/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kazuph-npm-packages
          path: distribution/npm
          if-no-files-found: error

  test-npm:
    needs: [preflight, package-npm]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kazuph-npm-packages
          path: distribution/npm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cold-install the wrapper with npm and Bun
        run: python3 scripts/fork_npm_packages.py --version "${{ needs.preflight.outputs.version }}" test --output distribution/npm

  release:
    needs: [preflight, test-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: herdr-*
          path: distribution/assets
          merge-multiple: true
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd distribution/assets
          shasum -a 256 herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Generate the tap Formula artifact
        run: python3 scripts/render_fork_homebrew_formula.py --version "${{ needs.preflight.outputs.version }}" --checksums distribution/assets/SHA256SUMS --output distribution/tap/Formula/herdr.rb
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: kazuph-v${{ needs.preflight.outputs.version }}
          files: |
            distribution/assets/herdr-linux-x86_64
            distribution/assets/herdr-linux-aarch64
            distribution/assets/herdr-macos-x86_64
            distribution/assets/herdr-macos-aarch64
            distribution/assets/SHA256SUMS
            distribution/tap/Formula/herdr.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kazuph-homebrew-tap-artifact
          path: distribution/tap/Formula/herdr.rb

  publish-native-npm:
    needs: [preflight, package-npm, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - herdr-darwin-arm64
          - herdr-darwin-x64
          - herdr-linux-arm64
          - herdr-linux-x64
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kazuph-npm-packages
          path: distribution/npm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the native package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="distribution/npm/kazuph-${{ matrix.package }}-${{ needs.preflight.outputs.version }}.tgz"
          PACKAGE="@kazuph/${{ matrix.package }}"
          VERSION="${{ needs.preflight.outputs.version }}"
          if PUBLISHED_URL="$(npm view "$PACKAGE@$VERSION" dist.tarball 2>/dev/null)"; then
            curl --fail --silent --show-error --location "$PUBLISHED_URL" --output published.tgz
            cmp "$ARCHIVE" published.tgz
          else
            npm publish "$ARCHIVE" --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wrapper-npm:
    needs: [preflight, package-npm, publish-native-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kazuph-npm-packages
          path: distribution/npm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the wrapper after all native packages
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="distribution/npm/kazuph-herdr-${{ needs.preflight.outputs.version }}.tgz"
          PACKAGE="@kazuph/herdr"
          VERSION="${{ needs.preflight.outputs.version }}"
          if PUBLISHED_URL="$(npm view "$PACKAGE@$VERSION" dist.tarball 2>/dev/null)"; then
            curl --fail --silent --show-error --location "$PUBLISHED_URL" --output published.tgz
            cmp "$ARCHIVE" published.tgz
          else
            npm publish "$ARCHIVE" --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-homebrew-formula:
    needs: [preflight, release]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kazuph-homebrew-tap-artifact
          path: distribution/tap/Formula
      - name: Install and test the generated Formula against immutable release assets
        run: |
          brew install --formula distribution/tap/Formula/herdr.rb
          brew test herdr

  publish-homebrew-tap:
    needs: [preflight, verify-homebrew-formula, publish-wrapper-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kazuph/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kazuph-homebrew-tap-artifact
          path: generated
      - name: Publish the verified Formula to kazuph/tap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp generated/herdr.rb tap/Formula/herdr.rb
          cd tap
          if test -z "$(git status --porcelain -- Formula/herdr.rb)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/herdr.rb
          git commit -m "herdr ${{ needs.preflight.outputs.version }}"
          git push origin HEAD:main

  verify-homebrew-tap:
    needs: [preflight, publish-homebrew-tap]
    runs-on: macos-latest
    steps:
      - name: Install through the public tap command
        shell: bash
        run: |
          set -euo pipefail
          brew tap kazuph/tap
          brew install kazuph/tap/herdr
          herdr --version | grep -F "${{ needs.preflight.outputs.version }}"
