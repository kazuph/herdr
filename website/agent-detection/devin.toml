id = "devin"
version = "2026.09.25.1"
min_engine_version = 1
updated_at = "2026-09-25T00:00:00Z"
# Fork-owned: this manifest carries fork-local detection rules that upstream
# does not ship. Remote manifests fetched for this agent are still cached, but
# the bundled manifest is always used regardless of the remote version.
fork_owned = true
aliases = ["devin-cli", "devin cli"]

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "do you trust the authors of this directory?",
  "with untrusted content.",
  "yes, trust ",
]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["approve once", "select", "confirm", "esc cancel"]

[[rules]]
id = "activity_footer_working"
state = "working"
priority = 200
region = "bottom_non_empty_lines(14)"
visible_working = true
# Devin's live footer is a braille spinner plus an activity and timer, e.g.
# "⠀⠚ Thinking · 26m 5s · (2962c)" or "⡆⠀ Running tools · 27m 9s
# (esc twice to interrupt)". The "· <digit>" timer keeps the braille Devin
# logo from matching. Newer builds hint "(esc twice to interrupt)" and older
# builds "(esc to interrupt)"; the second gate still requires the complete
# parenthesized hint at a line end so quoted copies in pane text cannot
# impersonate it, and it tolerates the pane wrapping inside the phrase.
any = [
  { line_regex = ['^\s*[\x{2800}-\x{28FF}]+[ \t]*\S[^·\n]*·\s*\d'] },
  { regex = ['(?m)\(esc(?:[ \t]+|\n[ \t]*)(?:twice(?:[ \t]+|\n[ \t]*))?to(?:[ \t]+|\n[ \t]*)interrupt\s*\)\s*$'] },
]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "guide_while_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["guide devin while it works"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "tool_reading_timeout"
state = "working"
priority = 180
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["reading shell ", "timeout:"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "welcome_prompt_footer"
state = "idle"
priority = 120
region = "bottom_non_empty_lines(8)"
visible_idle = true
contains = ["ask devin to build", "features, fix bugs", "your code"]
line_regex = ['^\s*❭ Ask Devin to build']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools", "esc to interrupt"] },
  { contains = ["guide devin while it works"] },
]

[[rules]]
id = "live_prompt_footer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_idle = true
contains = ["context:"]
line_regex = ['^\s*❭']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools", "esc to interrupt"] },
  { contains = ["guide devin while it works"] },
]
